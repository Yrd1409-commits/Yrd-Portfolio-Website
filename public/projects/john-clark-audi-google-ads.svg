<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">John Clark Audi Google Ads account build thumbnail</title>
  <desc id="desc">A clean white campaign preview image for a John Clark Audi Google Ads portfolio project.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F4F1E8"/>
      <stop offset="1" stop-color="#E8E4D6"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17365D"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0B1624" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1400" height="788" fill="url(#page)"/>
  <rect width="1400" height="788" filter="url(#grain)" opacity="0.5"/>

  <rect x="48" y="48" width="1304" height="692" rx="34" fill="#FBFAF5" stroke="#D9D4C5"/>

  <g transform="translate(96 92)">
    <rect x="0" y="0" width="354" height="96" rx="18" fill="#FFFFFF" stroke="#D7D1BF"/>
    <text x="28" y="34" fill="#122B4A" font-family="Almarai, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="1.2" dominant-baseline="middle">JOHN CLARK</text>
    <text x="30" y="66" fill="#65717D" font-family="Almarai, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.6" dominant-baseline="middle">MOTOR GROUP</text>
    <rect x="260" y="24" width="66" height="48" rx="24" fill="url(#navy)"/>
    <text x="293" y="50" fill="#FFFFFF" font-family="Almarai, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" dominant-baseline="middle">JC</text>
  </g>

  <g transform="translate(96 230)" font-family="Almarai, Arial, sans-serif">
    <text x="0" y="0" fill="#122B4A" font-size="70" font-weight="800" letter-spacing="-2" dominant-baseline="hanging">Audi search</text>
    <text x="0" y="76" fill="#122B4A" font-size="70" font-weight="800" letter-spacing="-2" dominant-baseline="hanging">campaign build</text>
    <text x="0" y="184" fill="#596675" font-size="27" dominant-baseline="hanging">Aberdeen + Dundee account architecture</text>

    <g transform="translate(0 280)">
      <rect x="0" y="0" width="218" height="48" rx="24" fill="#122B4A"/>
      <text x="109" y="25" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">Google Ads</text>
      <rect x="234" y="0" width="184" height="48" rx="24" fill="#FFFFFF" stroke="#D7D1BF"/>
      <text x="326" y="25" fill="#122B4A" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">Search</text>
      <rect x="434" y="0" width="252" height="48" rx="24" fill="#FFFFFF" stroke="#D7D1BF"/>
      <text x="560" y="25" fill="#122B4A" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">Automotive</text>
    </g>

    <g transform="translate(0 382)">
      <text x="0" y="0" fill="#7B807A" font-size="18" dominant-baseline="hanging">8 tabs: settings, ad groups, keywords, negatives, RSAs, sitelinks, extensions</text>
    </g>
  </g>

  <g transform="translate(742 92)" filter="url(#softShadow)" font-family="Almarai, Arial, sans-serif">
    <rect x="0" y="0" width="562" height="604" rx="28" fill="#FFFFFF" stroke="#D7D1BF"/>

    <g transform="translate(34 34)">
      <rect x="0" y="0" width="494" height="84" rx="18" fill="#F4F6F8" stroke="#E0E4E8"/>
      <text x="24" y="28" fill="#5F6B77" font-size="15" font-weight="700" dominant-baseline="middle">Google Search Preview</text>
      <text x="24" y="58" fill="#122B4A" font-size="22" font-weight="800" dominant-baseline="middle">Audi dealers in Aberdeen</text>
    </g>

    <g transform="translate(34 150)">
      <rect x="0" y="0" width="494" height="224" rx="22" fill="#FFFFFF" stroke="#D7D1BF"/>
      <text x="28" y="34" fill="#3C4043" font-size="15" dominant-baseline="middle">Ad · www.john-clark.co.uk/audi</text>
      <text x="28" y="78" fill="#1A0DAB" font-size="27" font-weight="700" dominant-baseline="middle">Used Audi Aberdeen &amp; Dundee</text>
      <text x="28" y="112" fill="#1A0DAB" font-size="27" font-weight="700" dominant-baseline="middle">John Clark Audi</text>
      <text x="28" y="154" fill="#3C4043" font-size="18" dominant-baseline="middle">Approved used Audi stock, finance options,</text>
      <text x="28" y="184" fill="#3C4043" font-size="18" dominant-baseline="middle">online reservation and local delivery support.</text>
    </g>

    <g transform="translate(34 410)">
      <rect x="0" y="0" width="232" height="120" rx="20" fill="#F7F5EF" stroke="#D7D1BF"/>
      <text x="24" y="34" fill="#122B4A" font-size="20" font-weight="800" dominant-baseline="middle">RSA copy</text>
      <text x="24" y="68" fill="#65717D" font-size="16" dominant-baseline="middle">15 headlines per ad group</text>
      <text x="24" y="96" fill="#65717D" font-size="16" dominant-baseline="middle">Character limits checked</text>

      <rect x="262" y="0" width="232" height="120" rx="20" fill="#F7F5EF" stroke="#D7D1BF"/>
      <text x="286" y="34" fill="#122B4A" font-size="20" font-weight="800" dominant-baseline="middle">Negatives</text>
      <text x="286" y="68" fill="#65717D" font-size="16" dominant-baseline="middle">Campaign + ad-group level</text>
      <text x="286" y="96" fill="#65717D" font-size="16" dominant-baseline="middle">Reasoning included</text>
    </g>
  </g>
</svg>
